<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Sevens Slot Oyunu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(20, 20, 40, 0.9);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #ff9800;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #ff9800;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
            margin-bottom: 5px;
        }

        .header p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .balance-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #333;
        }

        .balance-label {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .balance-amount {
            color: #4caf50;
            font-size: 2.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            margin-bottom: 15px;
        }

        .balance-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .balance-btn {
            background: linear-gradient(145deg, #ff9800, #e68a00);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .balance-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .custom-amount {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .custom-amount input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #555;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1rem;
        }

        .custom-amount button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .custom-amount button:hover {
            background: #45a049;
        }

        .slot-machine {
            background: #000;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            border: 3px solid #333;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .reels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .reel {
            background: rgba(20, 20, 40, 0.7);
            border-radius: 10px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px;
            border: 2px solid #444;
            overflow: hidden;
        }

        .symbol {
            font-size: 2.5rem;
            text-align: center;
            animation: spin 0.5s ease-out;
        }

        @keyframes spin {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .bet-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }

        .bet-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bet-label {
            color: #aaa;
            font-size: 1rem;
        }

        .bet-amount {
            color: #ff9800;
            font-size: 1.5rem;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        .bet-buttons button {
            background: #555;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bet-buttons button:hover {
            background: #666;
        }

        .win-section {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .win-label {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .win-amount {
            color: #4caf50;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .spin-button {
            width: 100%;
            background: linear-gradient(145deg, #4caf50, #45a049);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            margin-bottom: 20px;
        }

        .spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.6);
        }

        .spin-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .admin-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .admin-header h3 {
            color: #ff9800;
        }

        .admin-toggle {
            background: none;
            border: none;
            color: #ff9800;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .admin-panel {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-login {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .admin-login input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #555;
            background: rgba(0, 0, 0, 0.5);
            color: white;
        }

        .admin-login button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .admin-controls {
            display: none;
        }

        .admin-controls.active {
            display: block;
        }

        .admin-info {
            color: #4caf50;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 8px;
        }

        .admin-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-actions button {
            background: #333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
        }

        .admin-actions button:hover {
            background: #444;
        }

        .jackpot-section {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .jackpot-item {
            text-align: center;
        }

        .jackpot-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .jackpot-amount {
            color: #ff9800;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .jackpot-item:nth-child(2) .jackpot-amount {
            color: #4caf50;
        }

        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .admin-badge {
            background: #ff9800;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .reels {
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
            }
            
            .symbol {
                font-size: 2rem;
            }
            
            .balance-amount {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="user-info" id="userInfo">
        Ziyarətçi | Balans: <span id="userBalance">100,000.00</span> fun
    </div>

    <div class="container">
        <div class="header">
            <h1>🔥 HOT SEVENS 🔥</h1>
            <p>Ən maraqlı slot oyunu</p>
        </div>

        <div class="balance-section">
            <div class="balance-label">SİZİN BALANSINIZ</div>
            <div class="balance-amount" id="balanceDisplay">100,000.00</div>
            
            <div class="balance-buttons">
                <button class="balance-btn" onclick="addBalance(1000)">+1,000</button>
                <button class="balance-btn" onclick="addBalance(5000)">+5,000</button>
                <button class="balance-btn" onclick="addBalance(10000)">+10,000</button>
                <button class="balance-btn" onclick="addBalance(50000)">+50,000</button>
            </div>
            
            <div class="custom-amount">
                <input type="number" id="customAmount" placeholder="Xüsusi məbləğ" min="1">
                <button onclick="addCustomBalance()">Əlavə et</button>
            </div>
        </div>

        <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel1">
                    <div class="symbol">🍒</div>
                    <div class="symbol">🍋</div>
                    <div class="symbol">🍇</div>
                </div>
                <div class="reel" id="reel2">
                    <div class="symbol">🍊</div>
                    <div class="symbol">🍒</div>
                    <div class="symbol">🍋</div>
                </div>
                <div class="reel" id="reel3">
                    <div class="symbol">🍇</div>
                    <div class="symbol">🍊</div>
                    <div class="symbol">🍒</div>
                </div>
            </div>

            <div class="bet-section">
                <div class="bet-control">
                    <span class="bet-label">BAHİS:</span>
                    <span class="bet-amount" id="betAmount">100</span>
                </div>
                <div class="bet-buttons">
                    <button onclick="changeBet(-10)">-</button>
                    <button onclick="changeBet(10)">+</button>
                </div>
            </div>

            <div class="win-section">
                <div class="win-label">QAZANC</div>
                <div class="win-amount" id="winAmount">0</div>
            </div>

            <button class="spin-button" id="spinButton" onclick="spin()">
                🎰 DÖNDÜR 🎰
            </button>
        </div>

        <div class="admin-section">
            <div class="admin-header" onclick="toggleAdminPanel()">
                <h3>🔐 Admin Paneli</h3>
                <button class="admin-toggle" id="adminToggle">▼</button>
            </div>
            
            <div class="admin-panel" id="adminPanel">
                <div class="admin-login" id="adminLogin">
                    <input type="text" id="adminUsername" placeholder="Admin adı">
                    <input type="password" id="adminPassword" placeholder="Şifrə">
                    <button onclick="adminLogin()">Daxil ol</button>
                </div>
                
                <div class="admin-controls" id="adminControls">
                    <div class="admin-info">
                        Admin paneli aktivdir. İstifadəçi balanslarını idarə edə bilərsiniz.
                    </div>
                    
                    <div class="admin-actions">
                        <button onclick="setBalance(1000000)">1,000,000 fun qoy</button>
                        <button onclick="setBalance(5000000)">5,000,000 fun qoy</button>
                        <button onclick="setBalance(10000000)">10,000,000 fun qoy</button>
                        <button onclick="setBalance(999999999)">Maksimum balans qoy</button>
                        <button onclick="resetGame()">Oyunu sıfırla</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="jackpot-section">
            <div class="jackpot-item">
                <div class="jackpot-label">JACKPOT:</div>
                <div class="jackpot-amount" id="jackpotAmount">151,092.56 fun</div>
            </div>
            <div class="jackpot-item">
                <div class="jackpot-label">BONUS:</div>
                <div class="jackpot-amount" id="bonusAmount">226,578.84 fun</div>
            </div>
        </div>
    </div>

    <script>
        // Oyun məlumatları
        let balance = 100000;
        let bet = 100;
        let win = 0;
        let isAdmin = false;
        let isSpinning = false;
        
        // Simvollar və əmsallar
        const symbols = ['🍒', '🍋', '🍇', '🍊', '⭐', '7️⃣'];
        const payouts = {
            '🍒🍒🍒': 10,
            '🍋🍋🍋': 15,
            '🍇🍇🍇': 20,
            '🍊🍊🍊': 25,
            '⭐⭐⭐': 50,
            '7️⃣7️⃣7️⃣': 100,
            '🍒🍒': 2,
            '🍋🍋': 3,
            '🍇🍇': 4,
            '🍊🍊': 5,
            '⭐⭐': 10
        };

        // Admin məlumatları
        const adminCredentials = {
            username: 'admin',
            password: 'admin123'
        };

        // Səhifə yüklənəndə
        document.addEventListener('DOMContentLoaded', function() {
            updateDisplay();
            loadGameData();
        });

        // Balansı yenilə
        function updateDisplay() {
            document.getElementById('balanceDisplay').textContent = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('userBalance').textContent = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('betAmount').textContent = bet;
            document.getElementById('winAmount').textContent = win.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        // Balans əlavə et
        function addBalance(amount) {
            balance += amount;
            updateDisplay();
            saveGameData();
            showNotification(`${amount} fun əlavə edildi!`);
        }

        // Xüsusi məbləğ əlavə et
        function addCustomBalance() {
            const amount = parseInt(document.getElementById('customAmount').value);
            if (amount && amount > 0) {
                addBalance(amount);
                document.getElementById('customAmount').value = '';
            }
        }

        // Bahisi dəyiş
        function changeBet(amount) {
            const newBet = bet + amount;
            if (newBet >= 10 && newBet <= balance) {
                bet = newBet;
                updateDisplay();
            }
        }

        // Slot döndür
        function spin() {
            if (isSpinning || balance < bet) return;
            
            isSpinning = true;
            balance -= bet;
            win = 0;
            updateDisplay();
            
            document.getElementById('spinButton').disabled = true;
            
            // Hər çarx üçün animasiya
            const reels = [
                document.getElementById('reel1'),
                document.getElementById('reel2'),
                document.getElementById('reel3')
            ];
            
            const results = [];
            
            reels.forEach((reel, index) => {
                setTimeout(() => {
                    // Çarxı təmizlə
                    reel.innerHTML = '';
                    
                    // 3 simvol əlavə et
                    for (let i = 0; i < 3; i++) {
                        const symbol = symbols[Math.floor(Math.random() * symbols.length)];
                        const symbolDiv = document.createElement('div');
                        symbolDiv.className = 'symbol';
                        symbolDiv.textContent = symbol;
                        reel.appendChild(symbolDiv);
                        
                        if (i === 1) results[index] = symbol;
                    }
                    
                    // Son çarx bitdikdən sonra
                    if (index === 2) {
                        setTimeout(() => {
                            calculateWin(results);
                            isSpinning = false;
                            document.getElementById('spinButton').disabled = false;
                            saveGameData();
                        }, 500);
                    }
                }, index * 500);
            });
        }

        // Qazancı hesabla
        function calculateWin(results) {
            const resultKey = results.join('');
            let multiplier = 0;
            
            // Tam uyğunluq yoxla
            if (payouts[resultKey]) {
                multiplier = payouts[resultKey];
            } else {
                // Qismən uyğunluq yoxla
                for (let i = 0; i < results.length - 1; i++) {
                    const pair = results[i] + results[i+1];
                    if (payouts[pair]) {
                        multiplier = Math.max(multiplier, payouts[pair]);
                    }
                }
            }
            
            if (multiplier > 0) {
                win = bet * multiplier;
                balance += win;
                updateDisplay();
                
                if (multiplier >= 10) {
                    showNotification(`Böyük qazanc! ${win} fun qazandınız!`);
                }
            }
        }

        // Admin paneli aç/bağla
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const toggle = document.getElementById('adminToggle');
            
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
                toggle.textContent = '▼';
            } else {
                panel.classList.add('active');
                toggle.textContent = '▲';
            }
        }

        // Admin girişi
        function adminLogin() {
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            if (username === adminCredentials.username && password === adminCredentials.password) {
                isAdmin = true;
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminControls').classList.add('active');
                document.getElementById('userInfo').innerHTML = `
                    Admin | Balans: <span id="userBalance">${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}</span> fun
                    <span class="admin-badge">ADMIN</span>
                `;
                showNotification('Admin panelinə xoş gəlmisiniz!');
            } else {
                showNotification('Yanlış admin adı və ya şifrə!');
            }
        }

        // Balansı təyin et (admin funksiyası)
        function setBalance(amount) {
            if (isAdmin) {
                balance = amount;
                updateDisplay();
                saveGameData();
                showNotification(`Balans ${amount} fun olaraq təyin edildi!`);
            }
        }

        // Oyunu sıfırla (admin funksiyası)
        function resetGame() {
            if (isAdmin) {
                balance = 100000;
                bet = 100;
                win = 0;
                updateDisplay();
                saveGameData();
                showNotification('Oyun sıfırlandı!');
            }
        }

        // Bildiriş göstər
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #4caf50;
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 1000;
                animation: fadeIn 0.5s;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.5s';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 500);
            }, 3000);
        }

        // Oyun məlumatlarını yadda saxla
        function saveGameData() {
            const gameData = {
                balance: balance,
                bet: bet,
                isAdmin: isAdmin
            };
            localStorage.setItem('hotSevensGame', JSON.stringify(gameData));
        }

        // Oyun məlumatlarını yüklə
        function loadGameData() {
            const savedData = localStorage.getItem('hotSevensGame');
            if (savedData) {
                const gameData = JSON.parse(savedData);
                balance = gameData.balance || 100000;
                bet = gameData.bet || 100;
                isAdmin = gameData.isAdmin || false;
                
                if (isAdmin) {
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminControls').classList.add('active');
                    document.getElementById('userInfo').innerHTML = `
                        Admin | Balans: <span id="userBalance">${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}</span> fun
                        <span class="admin-badge">ADMIN</span>
                    `;
                }
                
                updateDisplay();
            }
        }

        // Animasiya üçün CSS əlavə et
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(-20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(-20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
