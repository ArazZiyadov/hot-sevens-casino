<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mənim Müasir Oyunum</title>
    <style>
        /* CSS - Dizayn hissəsi */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #score {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .game-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background: #ff416c;
            background: linear-gradient(to right, #ff4b2b, #ff416c);
            color: white;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }

        .game-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6);
        }

        .game-btn:active {
            transform: scale(0.95);
        }

        .message {
            margin-top: 20px;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xal Topla!</h1>
        <div id="score">0</div>
        <button class="game-btn" onclick="increaseScore()">KLİKLƏ</button>
        <p class="message" id="msg">Düyməyə bas və rekordu qır!</p>
    </div>

    <script>
        // JavaScript - Məntiq hissəsi
        let count = 0;
        const scoreDisplay = document.getElementById('score');
        const messageDisplay = document.getElementById('msg');

        function increaseScore() {
            count++;
            scoreDisplay.innerText = count;

            // Müəyyən xallarda mesajları dəyişək
            if (count === 10) {
                messageDisplay.innerText = "Yaxşı başlayırsan! 🔥";
                document.body.style.background = "linear-gradient(135deg, #11998e, #38ef7d)";
            } else if (count === 50) {
                messageDisplay.innerText = "Sən bir peşəkarsan! 🚀";
                document.body.style.background = "linear-gradient(135deg, #8e2de2, #4a00e0)";
            } else if (count === 100) {
                messageDisplay.innerText = "ƏFSANƏVİSƏN! 👑";
                document.body.style.background = "linear-gradient(135deg, #f8ff00, #3ad59f)";
            }
        }
    </script>

</body>
</html>
