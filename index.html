<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Müasir Kazino</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    min-height: 100vh;
  }

  header {
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 2.5em;
  }

  .casino-container {
    background: rgba(255, 255, 255, 0.1);
    padding: 30px;
    border-radius: 15px;
    margin-top: 20px;
    width: 90%;
    max-width: 600px;
  }

  .balance {
    font-size: 1.2em;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    justify-content: space-around;
    margin-bottom: 20px;
  }

  button {
    background-color: #2980b9;
    border: none;
    padding: 15px 30px;
    border-radius: 10px;
    font-size: 1em;
    cursor: pointer;
    transition: background 0.3s;
  }

  button:hover {
    background-color: #3498db;
  }

  .reels {
    display: flex;
    justify-content: space-around;
    margin-bottom: 20px;
  }

  .reel {
    width: 80px;
    height: 80px;
    background-color: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    color: #2c3e50;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  .result {
    text-align: center;
    font-size: 1.5em;
    min-height: 50px;
  }
</style>
</head>
<body>

<header>
  <h1>Müasir Kazino</h1>
</header>

<div class="casino-container">
  <div class="balance" id="balance">Balans: 1000 AZN</div>
  <div class="buttons">
    <button id="spinBtn">Sürüş</button>
  </div>
  <div class="reels">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">🔔</div>
  </div>
  <div class="result" id="result"></div>
</div>

<script>
  let balance = 1000;
  const reelSymbols = ['🍒', '🍋', '🔔', '💎', '7️⃣', '🍀'];
  const reel1 = document.getElementById('reel1');
  const reel2 = document.getElementById('reel2');
  const reel3 = document.getElementById('reel3');
  const resultDiv = document.getElementById('result');
  const balanceDiv = document.getElementById('balance');
  const spinBtn = document.getElementById('spinBtn');

  document.getElementById('spinBtn').addEventListener('click', () => {
    if (balance < 10) {
      alert('Balansınız kifayət deyil!');
      return;
    }

    balance -= 10; // hər spin üçün məbləğ
    updateBalance();

    // Döndürmə effekti
    let spinCount = 0;
    const maxSpins = 20;
    const spinInterval = setInterval(() => {
      reel1.textContent = reelSymbols[Math.floor(Math.random() * reelSymbols.length)];
      reel2.textContent = reelSymbols[Math.floor(Math.random() * reelSymbols.length)];
      reel3.textContent = reelSymbols[Math.floor(Math.random() * reelSymbols.length)];
      spinCount++;
      if (spinCount >= maxSpins) {
        clearInterval(spinInterval);
        checkResult();
      }
    }, 100);
  });

  function checkResult() {
    const sym1 = reel1.textContent;
    const sym2 = reel2.textContent;
    const sym3 = reel3.textContent;

    if (sym1 === sym2 && sym2 === sym3) {
      // Qazandıq
      let winnings = 50;
      balance += winnings;
      updateBalance();
      resultDiv.textContent = `Təbriklər! Siz ${winnings} AZN qazandınız!`;
    } else {
      resultDiv.textContent = 'Təəssüf ki, uduzdunuz. Yenidən cəhd edin!';
    }
  }

  function updateBalance() {
    balanceDiv.textContent = `Balans: ${balance} AZN`;
  }
</script>

</body>
</html>
