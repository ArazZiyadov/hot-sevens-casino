<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hot Sevens Slot Oyunu</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    background-size: 600% 600%;
    animation: bgGradient 15s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    min-height: 100vh;
    color: #fff;
  }

  @keyframes bgGradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  header {
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 2.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }

  .casino-container {
    background: rgba(0, 0, 0, 0.4);
    padding: 40px;
    border-radius: 20px;
    margin-top: 20px;
    width: 90%;
    max-width: 700px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  }

  .balance {
    font-size: 1.3em;
    margin-bottom: 25px;
    text-align: center;
  }

  .spin-button {
    display: block;
    margin: 0 auto 30px auto;
    padding: 15px 30px;
    font-size: 1.2em;
    background-color: #e67e22;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: background 0.3s;
  }

  .spin-button:hover {
    background-color: #d35400;
  }

  .reels {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .reel {
    width: 100px;
    height: 100px;
    background-color: #fff;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    font-weight: bold;
    color: #333;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  .result {
    margin-top: 30px;
    font-size: 1.5em;
    text-align: center;
    min-height: 50px;
  }
</style>
</head>
<body>

<header>
  <h1>Hot Sevens Slot</h1>
</header>

<div class="casino-container">
  <div class="balance" id="balance">Balans: 1000 AZN</div>
  <button class="spin-button" id="spinBtn">Sürüş</button>
  <div class="reels">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">🔔</div>
  </div>
  <div class="result" id="result"></div>
</div>

<script>
  let balance = 1000;
  const reelSymbols = ['🍒', '🍋', '🔔', '🍀', '7️⃣'];
  const reel1 = document.getElementById('reel1');
  const reel2 = document.getElementById('reel2');
  const reel3 = document.getElementById('reel3');
  const resultDiv = document.getElementById('result');
  const balanceDiv = document.getElementById('balance');
  const spinBtn = document.getElementById('spinBtn');

  // Qalib və uduş məbləğləri
  const payouts = {
    '7️⃣7️⃣7️⃣': 500,
    '🔔🔔🔔': 200,
    '🍒🍒🍒': 100,
    '🍋🍋🍋': 80,
    '🍀🍀🍀': 150,
  };

  document.getElementById('spinBtn').addEventListener('click', () => {
    if (balance < 50) {
      alert('Balansınız kifayət deyil! Minimum 50 AZN lazımdır.');
      return;
    }

    balance -= 50; // hər spin üçün məbləğ
    updateBalance();

    // Döndürmə effekti
    let spinCount = 0;
    const maxSpins = 20;
    const spinInterval = setInterval(() => {
      reel1.textContent = reelSymbols[Math.floor(Math.random() * reelSymbols.length)];
      reel2.textContent = reelSymbols[Math.floor(Math.random() * reelSymbols.length)];
      reel3.textContent = reelSymbols[Math.floor(Math.random() * reelSymbols.length)];
      spinCount++;
      if (spinCount >= maxSpins) {
        clearInterval(spinInterval);
        checkResult();
      }
    }, 100);
  });

  function checkResult() {
    const sym1 = reel1.textContent;
    const sym2 = reel2.textContent;
    const sym3 = reel3.textContent;

    const combo = sym1 + sym2 + sym3;

    if (payouts[combo]) {
      const winnings = payouts[combo];
      balance += winnings;
      updateBalance();
      resultDiv.textContent = `Qazandınız! ${winnings} AZN qazandınız!`;
    } else if (sym1 === sym2 && sym2 === sym3) {
      // Ümumi eynilik
      const winnings = 50;
      balance += winnings;
      updateBalance();
      resultDiv.textContent = `Təbriklər! 50 AZN qazandınız!`;
    } else {
      resultDiv.textContent = 'Uduzdunuz. Yenidən cəhd edin!';
    }
  }

  function updateBalance() {
    balanceDiv.textContent = `Balans: ${balance} AZN`;
  }
</script>

</body>
</html>
